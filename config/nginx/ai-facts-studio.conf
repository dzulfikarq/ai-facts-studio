# AI Facts Studio local development proxy. Included from nginx.conf sites-enabled/*.conf.
server {
    # Share the dedicated loopback socket used by other local vhosts; never bind the LAN listener.
    listen 127.0.0.1:80;
    server_name factstudio.me;

    # Host mapping is not a security boundary; reject non-loopback clients here too.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    client_max_body_size 120m;
    client_body_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # Keep API prefix intact; Express routes are already mounted under /api.
    location ^~ /api/ {
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /audio/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /visual-assets/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /scene-media/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location ^~ /outros/ {
        proxy_pass http://127.0.0.1:3001;
    }

    # Vite HMR WebSocket uses same-origin URL and Upgrade headers above.
    location / {
        proxy_pass http://127.0.0.1:5173;
    }
}
